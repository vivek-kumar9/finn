name: keepalive

# Backup for the keep-alive in db/schedule.sql. Render's free tier sleeps after
# 15 idle minutes and takes about 50 s to wake up, which made the first Telegram
# reply and the first research run slow. GitHub runs this far less often than
# every 10 minutes, which is why Supabase does it now.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 2 --max-time 90 "${{ secrets.FINN_API_URL }}/health"
